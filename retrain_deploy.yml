name: Closed-Loop MLOps Retrain & Deploy

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ data-drift-detected ]
  workflow_dispatch:

jobs:
  retrain-and-ship:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
      - name: Run Automated Unit Tests
        run: pytest -v

        run: pip install -r requirements.txt

      - name: Azure Login (OIDC Federated Credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Validation, Training & Champion Gate
        env:
          AZURE_STORAGE_ACCOUNT_URL: ${{ secrets.AZURE_STORAGE_ACCOUNT_URL }}
        run: python -m src.train

      - name: Build & Push Container to Azure Container Registry
        run: |
          az acr build --registry ${{ secrets.ACR_NAME }} --image churn-api:${{ github.sha }} .
